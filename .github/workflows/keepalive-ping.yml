name: Keepalive Ping

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

jobs:
  ping-backend:
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Validate target URL
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          if [[ -z "$RENDER_BACKEND_URL" ]]; then
            echo "Missing secret: RENDER_BACKEND_URL"
            echo "Set it to your public Render backend URL, e.g. https://your-service.onrender.com"
            exit 1
          fi

      - name: Ping health endpoint
        env:
          RENDER_BACKEND_URL: ${{ secrets.RENDER_BACKEND_URL }}
        run: |
          set -e
          BASE_URL="${RENDER_BACKEND_URL%/}"
          curl --fail --silent --show-error --max-time 20 "$BASE_URL/health"
